worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  server {
    listen 8080;
    location /health { return 200 "ok\n"; }
    location / {
      proxy_set_header X-Trace-Id $request_id;
      proxy_pass http://control-plane:8000;
    }
  }
}
